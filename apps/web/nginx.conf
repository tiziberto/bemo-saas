# Sirve la SPA y proxea la API al contenedor `api`.
# Mismo origen para el front y para /v1: así la cookie httpOnly del refresh
# token viaja sin líos de CORS ni de SameSite.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No anunciar la versión de nginx.
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Los assets llevan hash en el nombre: se pueden cachear para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El index nunca se cachea: es el que trae los nombres nuevos de los assets.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /v1/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # El import de pacientes manda el CSV en el body.
    client_max_body_size 2m;
  }

  # Rutas del router de Vue: todo lo demás cae en el index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
