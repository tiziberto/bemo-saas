name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  api:
    name: API build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # La suite corre contra un Postgres real: las policies RLS y el constraint
    # EXCLUDE anti-doble-turno no se pueden probar contra un mock.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bemo
          POSTGRES_PASSWORD: bemo
          POSTGRES_DB: bemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bemo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
